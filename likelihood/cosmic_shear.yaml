path: null
data_file: DES_Y3.dataset
accuracyboost: 1.0
integration_accuracy: 0
lmax: 50000 
kmax_boltzmann: 7.5
speed: 1
non_linear_emul: 2
debug: false
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
external_nz_modeling: 0
# gamma_t POINT-MASS KERNEL: 0 = default CosmoLike/y3_production,
#                            1 = CosmoSIS add_gammat_point_mass match
point_mass_model: 0
# WAVENUMBER (h/Mpc) of the growth factor used by the IA terms only:
#   null (default) = no IA-specific growth; IA uses the shared 5e-4 1/Mpc growth
#   <float>        = fixed k in h/Mpc (0.030350713668324276 = CosmoSIS TATT at h = 0.69)
#   "cosmosis"     = CosmoSIS TATT rule (first matter_power_lin k_h grid point
#                    above 0.03 h/Mpc) at the live h; see _cosmolike_prototype_base.py
ia_growth_k_hmpc: null
# UP-SAMPLING FACTOR U of the TATT FAST-PT table (cubic spline in ln k onto U x more
# nodes, once per cosmology): 1 (default) = off; see _cosmolike_prototype_base.py
fptia_upsampling: 1
use_emulator: False

# BIAS REDSHIFT EVOLUTION [b1,b2,bs2,b3,bmag] (see bias.c)
#bias_model: [0,0,0,1,0]

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/desy1xplanck/chains/pca.txt"

print_datavector: False
print_datavector_file: "./projects/des_y3/chains/theory.modelvector"

params: !defaults [params_source]
