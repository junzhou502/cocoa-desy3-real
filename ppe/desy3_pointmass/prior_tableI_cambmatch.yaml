timing: true
debug: false
stop_at_error: true

likelihood:
  des_y3.combo_3x2pt:
    path: ./projects/des_y3/data
    data_file: maglim_3x2pt.dataset
    accuracyboost: 1.0
    integration_accuracy: 0
    lmax: 50000
    kmax_boltzmann: 50.0
    non_linear_emul: 2
    IA_model: 1
    IA_redshift_evolution: 3
    use_baryon_pca: false
    debug: false
    create_baryon_pca: false
    baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
    filename_baryon_pca: ./projects/des_y3/data/pca.txt
    print_datavector: true
    print_datavector_file: ./projects/des_y3/ppe/desy3_pointmass/chains/prior_tableI_cambmatch/prior_tableI_cambmatch.modelvector

params: !defaults [../desy3_maglim/params_maglim_tableI]
theory:
  camb:
    path: ./external_modules/code/CAMB
    use_renames: true
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.1
      num_massive_neutrinos: 3
      nnu: 3.046
      dark_energy_model: fluid
      accurate_massive_neutrino_transfers: false
      kmax: 50

sampler:
  evaluate:
    N: 1

output: ./projects/des_y3/ppe/desy3_pointmass/chains/prior_tableI_cambmatch/cobaya
