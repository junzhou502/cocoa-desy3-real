  As_1e9:
    prior:
      min: 0.5
      max: 5.0
    ref: 2.19
    drop: true
    renames: A
    latex: 10^9 A_\mathrm{s}
  # Table I n_s U(0.87,1.07)
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref: 0.97
    latex: n_\mathrm{s}
  # Table I h U(0.55,0.91)
