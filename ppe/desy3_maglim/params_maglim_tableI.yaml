# (MagLim fiducial, 4 lens bins), for CoCoA des_y3. Generated by
# python_scripts/desy3_code_comparison/make_tableI_params.py (task
# desy3-pointmass-comparison-20260924). Include with
#   params: !defaults [params_maglim_tableI]   (path relative to the including yaml)
# Lens stretch 1-4 and shear m 1-4 use the unrounded official DES Y3 values that
# Table I rounds (reviewer decision 2026-09-24). Gaussian priors are truncated at the
# CosmoSIS values-file bounds, as CosmoSIS does. `ref` = the truth point of
# cosmosis/des_y3/des-y3-maglim-truth-values.ini (evaluate point; revisit for chains).
# DES_PM1-6 are fixed at 0: CosmoSIS marginalises the point masses analytically,
# CoCoA has no analytic marginalisation (STATE.md C12).
